    <header>
        <h1 class="titulo-topo">Portfólio Pessoal</h1>
        <hr>
        <h1 id="nome-digitado"></h1>
    </header> 
    
    <script src="particulas.js"></script>

    <script>
        const textoParaDigitar = "Matheus Duarte Louredo da Costa";
        const elementoNome = document.getElementById("nome-digitado");
        let contadorLetras = 0;

        function digitar() {
            if (contadorLetras < textoParaDigitar.length) {
                // Adiciona a próxima letra ao HTML
                elementoNome.innerHTML += textoParaDigitar.charAt(contadorLetras);
                contadorLetras++;
                
                // Define a velocidade da digitação (100 milissegundos por letra)
                setTimeout(digitar, 100); 
            }
        }

        // Inicia a função assim que a janela carrega
        window.onload = function() {
            setTimeout(digitar, 500); // Aguarda meio segundo antes de começar a escrever
        };
    </script>
